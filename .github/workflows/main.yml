name: Build Fateh Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          echo "Searching for Android project..."
          find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build debug APK
        run: |
          cd FatehMessenger
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: FatehMessenger/app/build/outputs/apk/debug/*.apk
